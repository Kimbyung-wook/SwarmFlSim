[project]
name = "swarm-api"
version = "0.1.0"
description = "Swarm flight plugin API and bus contract (WP0)"
requires-python = ">=3.12"
dependencies = [
    "protobuf>=5.28",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_api", "src/swarm"]
