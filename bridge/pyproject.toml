[project]
name = "swarm-bridge"
version = "0.1.0"
description = "WebSocket bridge between browsers and the swarm bus, protocol v1 (WP5, DEC-027)"
requires-python = ">=3.12"
dependencies = [
    "swarm-api",
    "websockets>=14",
]

[project.optional-dependencies]
zenoh = ["swarm-api[zenoh]"]

[project.scripts]
swarm-bridge = "swarm_bridge.cli:main"

[tool.uv.sources]
swarm-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_bridge"]
