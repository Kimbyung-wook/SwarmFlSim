# Gateway 연동용 CAL Server 설정 (agra_lacal server.config 형식, IMP-GW-013)
# 실행: uv run python -m swarm_gateway.lacal_server --config config/lacal_server.yaml
# 외부 교환은 봉투(DEC-111): Gateway → 외부 MA_TxDataPayloadCommand, 외부 → Gateway MA_RxDataPayload.
# 토픽은 내부 메시지의 토픽(<prefix>.<iface>)이다. 봉투를 끈 실행(--envelope off)은 lacal_server_raw.yaml
# UUID는 이 저장소에서 임의로 정한 값이다.
server_id: calsrv-swarm
system_uuid: 2a7d4c1e-6b0f-4e3a-9c55-0d8e7f1a2b30
system_label: SWARM-SIM-GW
listen: {host: 127.0.0.1, port: 8765}
admin: {host: 127.0.0.1, port: 8766}
schema:
  path: schema/A-GRA_MessageDefinitions_v6_0_a.xsd   # agra_lacal 루트 기준
  versions: ["006.0.ASK"]
owp_versions: ["1.0"]
allowed_topics: ["swarm.*"]
accept_unknown_services: false
backend: {type: local}
graph: {inactive_after_s: 10}

services:
  swarm_gateway:              # WP9 Gateway (gcs 쪽 지상 참여자)
    service: 6c0b0f8e-3d2a-4f1b-8e47-91a3c5d7e201
    declared:
      # 내부 메시지는 README 교환 표 15개(MA_PositionReport는 NavigationReport·PeerStatus의 uci_also, DEC-072)
      pub: [MA_TxDataPayloadCommand@swarm.vi, MA_TxDataPayloadCommand@swarm.c2, MA_TxDataPayloadCommand@swarm.p2p,
            MA_TxDataPayloadCommand@swarm.ms]
      sub: [MA_RxDataPayload@swarm.c2, MA_RxDataPayload@swarm.mp]
  external_c2:                # 외부 C2(운용자) 모사, 시험·수동 연동용
    service: 6c0b0f8e-3d2a-4f1b-8e47-91a3c5d7e202
    declared:
      pub: [MA_RxDataPayload@swarm.c2, MA_RxDataPayload@swarm.mp]
      sub: [MA_TxDataPayloadCommand@swarm.vi, MA_TxDataPayloadCommand@swarm.c2, MA_TxDataPayloadCommand@swarm.p2p,
            MA_TxDataPayloadCommand@swarm.ms]
