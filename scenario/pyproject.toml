[project]
name = "swarm-scenario"
version = "0.1.0"
description = "Scenario JSON Schema, validator and JSON -> proto converter (WP7)"
requires-python = ">=3.12"
dependencies = [
    "swarm-api",
    "jsonschema>=4.23",
    "protobuf>=5.28",
]

[project.scripts]
swarm-scenario = "swarm_scenario.cli:main"

[tool.uv.sources]
swarm-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_scenario"]
