// C2: GCS ⇄ MA. DEC-013, DEC-014
syntax = "proto3";

package swarm.v1;

import "swarm/v1/common.proto";
import "swarm/v1/options.proto";
import "swarm/v1/vi.proto";

message MoveToTask {
  Geodetic destination = 1;
  optional double speed_mps = 2;
}

message SearchAreaTask {
  Area area = 1;
}

message TrackTask {
  string target_id = 1;
}

message StrikeTask {
  string target_id = 1;
  optional Geodetic aim_point = 2;  // 좌표 유도 무장용
  string weapon_type = 3;           // aam_short | agm_short | fpv
}

message JamTask {
  Area area = 1;
  double duration_s = 2;  // 0이면 해제 명령까지
}

// 레이스트랙 선회 모양 (DEC-034). 중심·반경·방향은 이 메시지를 담은 작업에서 가져온다
message RacetrackShape {
  double leg_length_m = 1;      // 직선 구간 길이 = 두 원 중심 간 거리
  double axis_heading_deg = 2;  // 축 방향(진북 기준, 시계 방향)
}

// 선회 대기 (DEC-033). 필드가 없으면 현재 위치에서 기본 반경으로 다음 명령까지 선회
message HoldTask {
  optional Geodetic center = 1;     // 없으면 현재 위치. alt_m은 선회 고도
  optional double radius_m = 2;     // 없으면 MA 기본값
  optional double duration_s = 3;   // 없거나 0이면 다음 명령까지
  TurnDirection direction = 4;      // UNSPECIFIED면 MA가 정한다
  optional RacetrackShape racetrack = 5;  // 있으면 원 대신 레이스트랙 (DEC-034)
}

message ReturnToBaseTask {}

// 항로점 행위 (DEC-033). 항로점에 도착한 뒤 수행하고 다음 항로점으로 간다
message LoiterAction {
  double duration_s = 1;            // 선회 대기 시간
  optional double radius_m = 2;
  TurnDirection direction = 3;
  optional RacetrackShape racetrack = 4;  // 있으면 항로점 중심 레이스트랙 (DEC-034)
}

message ReconAction {
  double radius_m = 1;              // 항로점 중심 원 영역을 정찰한다
  optional double duration_s = 2;   // 없으면 MA가 영역 탐색을 마칠 때까지
}

message RouteWaypoint {
  Geodetic position = 1;            // alt_m은 이 구간의 목표 고도
  optional double speed_mps = 2;    // 이 항로점으로 가는 구간 속력
  optional double acceptance_radius_m = 3;
  oneof action {                    // 없으면 통과
    LoiterAction loiter = 4;
    ReconAction recon = 5;
  }
}

// 순서 있는 항로 비행 (EXT, DEC-033). Gateway는 외부로 내보내지 않는다
message RouteTask {
  repeated RouteWaypoint waypoints = 1;
  bool loop = 2;
}

message TaskCommand {
  option (uci_name) = "MA_TaskCommand";
  option (mapping) = MAPPING_CLASS_STD;
  option (l1) = L1_INTERFACE_C2;

  Header header = 1;
  string task_id = 2;
  repeated string assignees = 3;  // 엔티티 ID. 그룹은 펼쳐서 보낸다
  oneof task {
    MoveToTask move_to = 4;
    SearchAreaTask search_area = 5;
    TrackTask track = 6;
    StrikeTask strike = 7;
    JamTask jam = 8;
    HoldTask hold = 9;
    ReturnToBaseTask return_to_base = 10;
    RouteTask route = 12;  // EXT (DEC-033)
  }
  bool cancel = 11;  // true면 task_id 작업 취소
  LostLinkPolicy lost_link_policy = 13;  // EXT (DEC-078). UNSPECIFIED면 MA 변수 lost_link_policy를 따른다
}

// GCS 링크 상실 시 작업 처리 (DEC-078)
enum LostLinkPolicy {
  LOST_LINK_POLICY_UNSPECIFIED = 0;
  LOST_LINK_POLICY_HOLD_UNTIL_COMMAND = 1;  // 상실 시 제자리 선회. 복구 뒤에도 새 명령까지 선회 유지
  LOST_LINK_POLICY_RESUME_ON_RECOVERY = 2;  // 상실 시 제자리 선회. 복구되면 중단한 작업 재개
  LOST_LINK_POLICY_CONTINUE = 3;            // 상실·복구와 무관하게 작업 지속
}

// 통제 GCS → 기체 C2 링크 생존 신호 (DEC-078). Datalink가 발생시킨다
message GcsHeartbeat {
  option (mapping) = MAPPING_CLASS_EXT;
  option (l1) = L1_INTERFACE_C2;

  Header header = 1;   // source = GCS 엔티티
  uint32 sequence = 2;  // GCS·기체 쌍별 1부터 증가
}

message TaskStatus {
  option (uci_name) = "MA_TaskStatus";
  option (mapping) = MAPPING_CLASS_STD;
  option (l1) = L1_INTERFACE_C2;

  Header header = 1;
  string task_id = 2;
  CommandState state = 3;
  double progress = 4;  // 0..1
  string reason = 5;
}

enum FormationShape {
  FORMATION_SHAPE_UNSPECIFIED = 0;
  FORMATION_SHAPE_LINE = 1;
  FORMATION_SHAPE_COLUMN = 2;
  FORMATION_SHAPE_WEDGE = 3;
  FORMATION_SHAPE_ECHELON = 4;
  FORMATION_SHAPE_CIRCLE = 5;
  FORMATION_SHAPE_CUSTOM = 6;
}

// A-GRA에 대응 메시지가 없는 편대 명령 (DEC-014)
message FormationCommand {
  option (mapping) = MAPPING_CLASS_EXT;
  option (l1) = L1_INTERFACE_C2;

  Header header = 1;
  string group_id = 2;
  repeated string members = 3;
  string leader = 4;                  // 비우면 알고리즘이 정한다
  FormationShape shape = 5;
  double spacing_m = 6;
  repeated Vec3 custom_offsets_m = 7;  // CUSTOM: 리더 기준 FRD 오프셋, members 순서
}

// RTS 그룹 지정 (REQ-UI-002)
message GroupAssignment {
  option (mapping) = MAPPING_CLASS_EXT;
  option (l1) = L1_INTERFACE_C2;

  Header header = 1;
  string group_id = 2;
  repeated string members = 3;
}

message ApprovalRequest {
  option (uci_name) = "MA_ApprovalRequest";
  option (mapping) = MAPPING_CLASS_STD;
  option (l1) = L1_INTERFACE_C2;

  Header header = 1;
  string request_id = 2;
  string task_id = 3;
  string target_id = 4;
  string description = 5;
}

// 외부 운용자의 승인 응답 (DEC-075)
message ApprovalResponse {
  option (uci_name) = "MA_ApprovalRequestStatus";
  option (mapping) = MAPPING_CLASS_STD;
  option (l1) = L1_INTERFACE_C2;

  Header header = 1;
  string request_id = 2;
  bool approved = 3;
}
