// VI: MA ⇄ FA (비행체 인터페이스). PRP-GNC-001, DEC-013
syntax = "proto3";

package swarm.v1;

import "swarm/v1/common.proto";
import "swarm/v1/entity.proto";
import "swarm/v1/options.proto";

// Heading/Speed/Altitude
message HsaCommand {
  optional double heading_deg = 1;
  optional double speed_mps = 2;
  optional double altitude_m = 3;
}

message Waypoint {
  Geodetic position = 1;
  optional double speed_mps = 2;
  double acceptance_radius_m = 3;
}

message WaypointCommand {
  repeated Waypoint waypoints = 1;
  bool loop = 2;
}

enum TurnDirection {
  TURN_DIRECTION_UNSPECIFIED = 0;
  TURN_DIRECTION_CW = 1;
  TURN_DIRECTION_CCW = 2;
}

message OrbitCurve {
  Geodetic center = 1;
  double radius_m = 2;
  TurnDirection direction = 3;
  optional double speed_mps = 4;
}

// 레이스트랙: 두 원(중심 간 거리 leg_length_m)과 두 직선 구간 (DEC-034)
// 원 중심 = center ± (leg_length_m/2)·축 방향. 유도 방식은 FA 매개변수로 고른다
message RacetrackCurve {
  Geodetic center = 1;          // 두 원 중심의 중점. alt_m은 선회 고도
  double radius_m = 2;          // 선회 반경
  double leg_length_m = 3;      // 직선 구간 길이 = 두 원 중심 간 거리
  double axis_heading_deg = 4;  // 축 방향(진북 기준, 시계 방향)
  TurnDirection direction = 5;
  optional double speed_mps = 6;
}

message CurveCommand {
  oneof curve {
    OrbitCurve orbit = 1;
    RacetrackCurve racetrack = 2;
  }
}

message FlightCommand {
  option (uci_name) = "MA_FlightCommand";
  option (mapping) = MAPPING_CLASS_STD;
  option (l1) = L1_INTERFACE_VI;

  Header header = 1;
  string command_id = 2;
  oneof mode {
    HsaCommand hsa = 3;
    WaypointCommand waypoint = 4;
    CurveCommand curve = 5;
  }
}

message FlightCommandStatus {
  option (uci_name) = "MA_FlightCommandStatus";
  option (mapping) = MAPPING_CLASS_STD;
  option (l1) = L1_INTERFACE_VI;

  Header header = 1;
  string command_id = 2;
  CommandState state = 3;
  string reason = 4;
}

message FlightCapability {
  option (uci_name) = "MA_FlightCapability";
  option (mapping) = MAPPING_CLASS_STD;
  option (l1) = L1_INTERFACE_VI;

  Header header = 1;
  double min_speed_mps = 2;
  double max_speed_mps = 3;
  double max_climb_mps = 4;
  double max_bank_deg = 5;
  double max_altitude_m = 6;
  bool supports_hsa = 7;
  bool supports_waypoint = 8;
  bool supports_curve = 9;
}

// 센서 잡음이 포함된 항법 상태. ground truth가 아니다 (PRP-SIM-003)
message NavigationReport {
  option (uci_name) = "MA_NavigationReport";
  option (uci_also) = "MA_PositionReport";
  option (mapping) = MAPPING_CLASS_STD;
  option (l1) = L1_INTERFACE_VI;

  Header header = 1;
  KinematicState kinematics = 2;
  double position_sigma_m = 3;
}

// Core → Agent, 프레임당 1건 (DEC-081). reports[i].header.source가 기체 ID이고 ID 순이다
// 항법 고장 등으로 이번 프레임에 항법이 없는 기체는 빠진다
message NavigationBatch {
  option (mapping) = MAPPING_CLASS_SIM;

  Header header = 1;
  repeated NavigationReport reports = 2;
}

enum Health {
  HEALTH_UNSPECIFIED = 0;
  HEALTH_NOMINAL = 1;
  HEALTH_DEGRADED = 2;
  HEALTH_FAILED = 3;
}

message SubsystemStatus {
  string name = 1;  // engine | nav | link | cam0 | ...
  Health health = 2;
}

message SystemStatus {
  option (uci_name) = "SystemStatus";
  option (mapping) = MAPPING_CLASS_STD;
  option (l1) = L1_INTERFACE_VI;

  Header header = 1;
  Health health = 2;
  double energy_frac = 3;
  repeated SubsystemStatus subsystems = 4;
}
