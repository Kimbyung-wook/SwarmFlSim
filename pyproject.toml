[project]
name = "swarm-flight"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
package = false

# Python 패키지를 만드는 WP는 여기에 디렉터리를 추가한다 (DEC-021)
[tool.uv.workspace]
members = ["api/python", "scenario", "bridge"]

[tool.uv.sources]
swarm-api = { workspace = true }
swarm-scenario = { workspace = true }
swarm-bridge = { workspace = true }

# 워크스페이스 패키지를 추가하면 dev 그룹과 testpaths에도 넣는다
[dependency-groups]
dev = [
    "swarm-api[zenoh]",
    "swarm-scenario",
    "swarm-bridge",
    "pytest>=8",
    "grpcio-tools>=1.66",
]

[tool.pytest.ini_options]
testpaths = ["api/python/tests", "scenario/tests", "bridge/tests"]
