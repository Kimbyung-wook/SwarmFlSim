[project]
name = "swarm-algorithms"
version = "0.1.0"
description = "Default MA plugins: hold, waypoint, formation, flocking (WP3)"
requires-python = ">=3.12"
dependencies = [
    "swarm-api",
    "swarm-agent",
    "numpy>=2.0",
    "protobuf>=5.28",
]

[project.entry-points."swarm.ma"]
hold = "swarm_algorithms.hold:Hold"
waypoint = "swarm_algorithms.waypoint:WaypointFollower"
formation = "swarm_algorithms.formation:Formation"
flocking = "swarm_algorithms.flocking:Flocking"
# 예제 시나리오(scenario/examples)가 쓰는 이름
flocking_basic = "swarm_algorithms.flocking:Flocking"

[tool.uv.sources]
swarm-api = { workspace = true }
swarm-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_algorithms"]
