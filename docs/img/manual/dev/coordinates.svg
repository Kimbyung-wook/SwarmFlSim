<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <title>NED local frame, FRD body frame, course angle and wind triangle</title>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2c6fbb"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e8b57"/></marker>
  </defs>
  <rect width="860" height="380" fill="#ffffff"/>
  <line x1="430" y1="20" x2="430" y2="360" stroke="#d5d9df"/>

  <!-- 왼쪽: 위에서 본 NED와 FRD -->
  <text x="20" y="32" font-weight="bold" fill="#222">Top view: NED and FRD</text>
  <g transform="translate(90,300)">
    <line x1="0" y1="0" x2="0" y2="-220" stroke="#333" marker-end="url(#k)"/>
    <text x="-8" y="-228" font-weight="bold">N</text>
    <line x1="0" y1="0" x2="300" y2="0" stroke="#333" marker-end="url(#k)"/>
    <text x="307" y="5" font-weight="bold">E</text>
    <circle r="9" fill="none" stroke="#333"/><line x1="-6" y1="-6" x2="6" y2="6" stroke="#333"/><line x1="-6" y1="6" x2="6" y2="-6" stroke="#333"/>
    <text x="-34" y="26">D (down)</text>

    <!-- 침로 45도 위치 (130,-90) -->
    <g transform="translate(120,-90)">
      <g transform="rotate(45)">
        <polygon points="0,-18 13,14 0,7 -13,14" fill="#2c6fbb"/>
        <line x1="0" y1="-18" x2="0" y2="-82" stroke="#2c6fbb" stroke-width="2" marker-end="url(#b)"/>
        <line x1="13" y1="0" x2="72" y2="0" stroke="#2c6fbb" stroke-width="2" marker-end="url(#b)"/>
      </g>
      <text x="62" y="-66" fill="#2c6fbb" font-weight="bold">F</text>
      <text x="58" y="66" fill="#2c6fbb" font-weight="bold">R</text>
      <line x1="0" y1="0" x2="0" y2="-82" stroke="#9aa3ad" stroke-dasharray="5 4"/>
      <path d="M0 -58 A58 58 0 0 1 41 -41" fill="none" stroke="#c0392b" stroke-width="2"/>
      <text x="4" y="-64" fill="#c0392b">χ</text>
    </g>
  </g>

  <!-- 오른쪽: 바람 -->
  <text x="450" y="32" font-weight="bold" fill="#222">Air velocity, wind, ground velocity</text>
  <g transform="translate(510,300)">
    <line x1="0" y1="0" x2="110" y2="-190" stroke="#2c6fbb" stroke-width="3" marker-end="url(#b)"/>
    <line x1="110" y1="-190" x2="240" y2="-150" stroke="#c0392b" stroke-width="3" marker-end="url(#r)"/>
    <line x1="0" y1="0" x2="240" y2="-150" stroke="#2e8b57" stroke-width="3" marker-end="url(#g)"/>
    <text x="-8" y="-120" fill="#2c6fbb">air velocity</text>
    <text x="-8" y="-101" fill="#2c6fbb" font-size="13">(model state)</text>
    <text x="160" y="-190" fill="#c0392b">wind_ned_mps</text>
    <text x="134" y="-52" fill="#2e8b57">ground velocity</text>
    <text x="134" y="-33" fill="#2e8b57" font-size="13">(to_kinematic output)</text>
  </g>
</svg>
